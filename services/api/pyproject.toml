[project]
name = "chill-api"
version = "0.5.0"
description = "Chill voice backend: enrollment, verification, consent and audit."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
  "numpy>=1.26",
  "pgvector>=0.3",
  "httpx>=0.27",
  # Audio decoding for every enrollment, verification and dictation request.
  # The recorder uploads m4a/webm/wav, so PyAV is needed on a base install, not
  # only alongside the real speaker model.
  "av>=19.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "alembic>=1.13",
]
# Real speaker verification. The CPU wheels keep the install small enough for
# CI; a GPU deployment swaps them for the matching CUDA builds.
speaker = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "speechbrain>=1.0",
  "scipy>=1.11",
  "soundfile>=0.12",
]
# Speech-to-text for spoken challenge-response. The default provider is the
# deterministic placeholder, so this is only needed to run the real check.
stt = [
  "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The speaker suite downloads/loads a real model, so it is opt-in:
# `pytest -m speaker` (the CLI -m overrides this default).
addopts = "-m 'not speaker'"
markers = [
  "speaker: exercises the real ECAPA model (slow, needs the `speaker` extra)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
